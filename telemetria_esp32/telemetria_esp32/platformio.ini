[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    ; Rede UAVCAN (Nativa - Pinos 4 e 5)
    sandeepmistry/CAN @ ^0.3.1
    https://github.com/107-systems/107-Arduino-UAVCAN.git
    
    ; Victron BLE (Passivo)
    scottp/VictronBLE @ ^0.6.0
    
    ; Golden Motor / EZControl (MCP2515 via SPI)
    coryjfowler/mcp_can @ ^1.5.0